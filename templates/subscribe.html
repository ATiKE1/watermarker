<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Подписка | Watermarker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../static/css/style.css" rel="stylesheet">
</head>
<body>
<div class="container">
    <h2 class="mb-4">Оформление подписки</h2>
    {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
    {% endif %}
    {% if success %}
        <div class="alert alert-success">{{ success }}</div>
    {% endif %}

    <form action="/subscribe" method="post" class="card p-4">
        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" name="email" id="email" required>
        </div>

        <div class="mb-3">
            <label for="plan" class="form-label">План</label>
            <select class="form-select" id="plan" name="plan">
                <option value="monthly">Monthly (30 дней)</option>
                <option value="yearly">Yearly (365 дней)</option>
            </select>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-success">Активировать</button>
            <a href="/" class="btn btn-outline-secondary">Назад</a>
        </div>
    </form>
</div>
</body>
</html>
