<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watermarker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="../static/css/style.css" rel="stylesheet">
</head>
<body class="bg-gradient-to-br from-zinc-950 via-red-950 to-zinc-900 min-h-screen text-red-100">
<div class="max-w-5xl mx-auto px-4 py-8">
    <div class="bg-zinc-900/85 border border-red-900 rounded-2xl shadow-2xl shadow-red-950/40 p-6 md:p-8 backdrop-blur-sm">
        <h1 class="text-3xl font-bold text-red-300">Watermarker</h1>
        <p class="text-sm text-red-200/80 mt-2">Темная красная тема + множественные watermark. Ограничения по подписке применяются до отправки формы.</p>

        <form id="watermarkForm" action="/process" method="post" enctype="multipart/form-data" class="mt-6 space-y-5">
            <div>
                <label for="subscription_email" class="block text-sm font-semibold text-red-200 mb-1">Email подписки</label>
                <div class="flex gap-2">
                    <input class="w-full rounded-lg border border-red-800 bg-zinc-950 text-red-100 placeholder-red-300/50 focus:border-red-500 focus:ring-red-500" type="email" name="subscription_email" id="subscription_email" placeholder="you@example.com">
                    <button type="button" id="checkSubscription" class="px-4 py-2 rounded-lg bg-red-700 text-red-50 hover:bg-red-600">Проверить</button>
                </div>
                <p id="limitHint" class="text-xs text-red-300 mt-1">Текущий лимит watermark: {{ free_limit }}</p>
                <button type="button" id="openSubscribeModal" class="text-sm text-red-300 underline mt-1 hover:text-red-200">Оформить подписку</button>
            </div>

            <div class="grid md:grid-cols-2 gap-4">
                <div>
                    <label for="image" class="block text-sm font-semibold text-red-200 mb-1">Базовое изображение</label>
                    <input class="w-full rounded-lg border border-red-800 bg-zinc-950 text-red-100" type="file" name="image" id="image" accept="image/*" required>
                </div>
                <div>
                    <label for="watermarks" class="block text-sm font-semibold text-red-200 mb-1">Watermark файлы (PNG)</label>
                    <input class="w-full rounded-lg border border-red-800 bg-zinc-950 text-red-100" type="file" name="watermarks" id="watermarks" accept="image/png" multiple required>
                </div>
            </div>

            <div id="preview-container" class="rounded-xl border-2 border-dashed border-red-800 bg-zinc-950/80 p-2 min-h-[260px]">
                <img id="base-preview" src="" alt="Base image preview" class="w-full hidden rounded-lg">
            </div>

            <div class="bg-zinc-950/80 border border-red-900 rounded-xl p-4">
                <h3 class="font-semibold text-red-300">Слои watermark</h3>
                <div id="layerList" class="mt-3"></div>
                <input type="hidden" name="watermark_configs" id="watermark_configs" value="[]">
                <input type="hidden" name="preview_width" id="preview_width" value="1">
                <input type="hidden" name="preview_height" id="preview_height" value="1">

                <div class="mt-4">
                    <label for="opacity" class="block text-sm font-semibold text-red-200">Opacity активного слоя</label>
                    <input type="range" id="opacity" min="0" max="255" value="128" class="w-full accent-red-500">
                </div>

                <div class="mt-3">
                    <label for="scale" class="block text-sm font-semibold text-red-200">Scale активного слоя (%)</label>
                    <input type="range" id="scale" min="10" max="200" value="50" class="w-full accent-red-500">
                </div>
            </div>

            <button type="submit" class="w-full py-3 rounded-xl bg-red-700 text-red-50 text-lg font-semibold hover:bg-red-600">Process Image</button>
        </form>
    </div>
</div>

<div id="appModal" class="modal-overlay hidden">
    <div class="modal-card">
        <div class="flex items-center justify-between mb-3">
            <h2 id="modalTitle" class="text-xl font-bold text-red-300">Уведомление</h2>
            <button type="button" id="closeModal" class="text-red-300 hover:text-red-100">✕</button>
        </div>
        <div id="modalBody" class="text-sm text-red-100"></div>
    </div>
</div>

<div id="subscribeModalTemplate" class="hidden">
    <form id="subscribeForm" class="space-y-3">
        <div>
            <label class="block text-sm font-medium text-red-200 mb-1" for="sub_email">Email</label>
            <input id="sub_email" name="email" type="email" class="w-full rounded-lg border border-red-800 bg-zinc-950 text-red-100" required>
        </div>
        <div>
            <label class="block text-sm font-medium text-red-200 mb-1" for="plan">План</label>
            <select id="plan" name="plan" class="w-full rounded-lg border border-red-800 bg-zinc-950 text-red-100">
                <option value="monthly">Monthly (30 дней)</option>
                <option value="yearly">Yearly (365 дней)</option>
            </select>
        </div>
        <button type="submit" class="w-full py-2 rounded-lg bg-red-700 text-red-50 hover:bg-red-600">Активировать подписку</button>
    </form>
</div>

<script src="../static/js/main_logic.js"></script>
</body>
</html>
