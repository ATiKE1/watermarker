<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watermarker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../static/css/style.css" rel="stylesheet">
</head>
<body>
<div class="container text-center">
    <h2>Python Watermarker</h2>
    <p class="text-muted">Добавляйте несколько watermark за один рендер. Бесплатно: 1 слой, с подпиской: до 10.</p>

    <form id="watermarkForm" action="/process" method="post" enctype="multipart/form-data">
        <div class="mb-3">
            <label for="subscription_email" class="form-label">Email для проверки подписки</label>
            <input class="form-control" type="email" name="subscription_email" id="subscription_email" placeholder="you@example.com">
            <div class="form-text">Нет подписки? <a href="/subscribe">Оформить</a></div>
        </div>

            <div id="preview-container" class="rounded-xl border-2 border-dashed border-red-800 bg-zinc-950/80 p-2 min-h-[260px]">
                <img id="base-preview" src="" alt="Base image preview" class="w-full hidden rounded-lg">
            </div>

        <div class="mb-3">
            <label for="watermarks" class="form-label">Upload Watermarks (PNG)</label>
            <input class="form-control" type="file" name="watermarks" id="watermarks" accept="image/png" multiple required>
        </div>

        <div id="preview-container">
            <img id="base-preview" src="" alt="Base image preview" style="width:100%; display:none;">
        </div>

        <div class="watermark-panel card p-3 mb-3">
            <h5 class="mb-3">Слои watermark</h5>
            <div id="layerList" class="mb-3"></div>
            <input type="hidden" name="watermark_configs" id="watermark_configs" value="[]">
            <input type="hidden" name="preview_width" id="preview_width" value="1">
            <input type="hidden" name="preview_height" id="preview_height" value="1">

            <div class="mb-2">
                <label for="opacity" class="form-label">Opacity активного слоя</label>
                <input type="range" class="form-range" id="opacity" min="0" max="255" value="128">
            </div>

            <div class="mb-2">
                <label for="scale" class="form-label">Scale активного слоя (%)</label>
                <input type="range" class="form-range" id="scale" min="10" max="200" value="50">
            </div>
        </div>
        <div id="modalBody" class="text-sm text-red-100"></div>
    </div>
</div>

<div id="subscribeModalTemplate" class="hidden">
    <form id="subscribeForm" class="space-y-3">
        <div>
            <label class="block text-sm font-medium text-red-200 mb-1" for="sub_email">Email</label>
            <input id="sub_email" name="email" type="email" class="w-full rounded-lg border border-red-800 bg-zinc-950 text-red-100" required>
        </div>
    </form>
</div>

<script src="../static/js/main_logic.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
